[project]
name = "inverse-vol-futures-overlay"
version = "1.0.0"
description = "Walk-forward research on inverse-volatility multi-asset books, a vol-targeted futures overlay, and how robust the results are."
readme = "README.md"
license = "MIT"
authors = [{ name = "Liangxi Wang" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.2",
    "seaborn>=0.13",
    "typst>=0.14",
    "yfinance>=0.2.60",
]

[project.scripts]
ivoverlay = "ivoverlay.study:main"
ivoverlay-report = "ivoverlay.report:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ivoverlay"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/ivoverlay/viz_style.py"]  # vendored personal style file

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["B905"]  # zip(axes, "abc") pairs panels with letters; lengths differ on purpose

[tool.ruff.lint.per-file-ignores]
"src/ivoverlay/plots.py" = ["F403", "F405", "E402"]  # names come from the vendored style module
